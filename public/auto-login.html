<!DOCTYPE html>
<html>
<head>
    <title>Auto Login for SGMM</title>
</head>
<body>
    <h1>Auto Login Script</h1>
    <p>This will automatically log you in...</p>
    
    <script>
        async function autoLogin() {
            try {
                console.log('Starting auto login...');
                
                // Login request
                const formData = new URLSearchParams();
                formData.append('username', 'admin@consultorio.com');
                formData.append('password', 'admin123');

                const response = await fetch('http://localhost:8000/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData,
                });

                if (!response.ok) {
                    throw new Error('Login failed');
                }

                const data = await response.json();
                console.log('Login successful, token received');
                
                // Store token in cookies and localStorage
                document.cookie = `auth_token=${data.access_token}; path=/; max-age=86400`;
                localStorage.setItem('auth_token', data.access_token);
                
                console.log('Token stored in cookies and localStorage');
                
                // Redirect to treatments page
                window.location.href = '/treatments';
                
            } catch (error) {
                console.error('Auto login failed:', error);
                document.body.innerHTML += '<p style="color: red;">Login failed: ' + error.message + '</p>';
                document.body.innerHTML += '<p><a href="/login">Go to manual login</a></p>';
            }
        }
        
        // Run auto login when page loads
        autoLogin();
    </script>
</body>
</html>
