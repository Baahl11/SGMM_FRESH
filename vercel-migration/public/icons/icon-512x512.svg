<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#grad)"/>
  
  <!-- Calendar outline -->
  <rect x="96" y="128" width="320" height="288" rx="32" fill="none" stroke="white" stroke-width="32"/>
  
  <!-- Calendar top bars -->
  <line x1="192" y1="96" x2="192" y2="160" stroke="white" stroke-width="32" stroke-linecap="round"/>
  <line x1="320" y1="96" x2="320" y2="160" stroke="white" stroke-width="32" stroke-linecap="round"/>
  
  <!-- Calendar header line -->
  <line x1="96" y1="208" x2="416" y2="208" stroke="white" stroke-width="32"/>
  
  <!-- Medical cross -->
  <line x1="256" y1="272" x2="256" y2="368" stroke="white" stroke-width="40" stroke-linecap="round"/>
  <line x1="208" y1="320" x2="304" y2="320" stroke="white" stroke-width="40" stroke-linecap="round"/>
</svg>
