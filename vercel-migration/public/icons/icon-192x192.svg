<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="192" height="192" rx="36" fill="url(#grad)"/>
  
  <!-- Calendar outline -->
  <rect x="36" y="48" width="120" height="108" rx="12" fill="none" stroke="white" stroke-width="12"/>
  
  <!-- Calendar top bars -->
  <line x1="72" y1="36" x2="72" y2="60" stroke="white" stroke-width="12" stroke-linecap="round"/>
  <line x1="120" y1="36" x2="120" y2="60" stroke="white" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Calendar header line -->
  <line x1="36" y1="78" x2="156" y2="78" stroke="white" stroke-width="12"/>
  
  <!-- Medical cross -->
  <line x1="96" y1="102" x2="96" y2="138" stroke="white" stroke-width="15" stroke-linecap="round"/>
  <line x1="78" y1="120" x2="114" y2="120" stroke="white" stroke-width="15" stroke-linecap="round"/>
</svg>
