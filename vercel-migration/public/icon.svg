<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="48" height="48" rx="10" fill="url(#grad1)"/>
  
  <!-- Calendar -->
  <rect x="10" y="12" width="28" height="26" rx="3" fill="none" stroke="white" stroke-width="3"/>
  <line x1="18" y1="8" x2="18" y2="16" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="8" x2="30" y2="16" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="10" y1="20" x2="38" y2="20" stroke="white" stroke-width="3"/>
  
  <!-- Medical Cross -->
  <line x1="24" y1="26" x2="24" y2="34" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="20" y1="30" x2="28" y2="30" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
</svg>
